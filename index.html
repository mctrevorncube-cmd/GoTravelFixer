                <div className="md:col-span-4 space-y-3">
                  <h4 className="text-xs font-bold uppercase tracking-wider text-goldBrand">Field Dispatch</h4>
                  <p className="text-sm text-ivory/75">
                    One honest note from Ghana every fortnight. No spam.
                  </p>
                  {newsletterSubscribed ? (
                    <p className="text-sm font-medium text-goldBrand">You're on the list.</p>
                  ) : (
                    <form
                      onSubmit={(e) => {
                        e.preventDefault();
                        if (newsletterEmail) setNewsletterSubscribed(true);
                      }}
                      className="flex gap-2"
                    >
                      <label htmlFor="newsletter-email" className="sr-only">Email address</label>
                      <input
                        id="newsletter-email"
                        type="email"
                        required
                        value={newsletterEmail}
                        onChange={(e) => setNewsletterEmail(e.target.value)}
                        placeholder="you@example.com"
                        className="flex-1 px-3.5 py-2.5 rounded-lg bg-ivory/10 border border-ivory/20 text-sm text-ivory placeholder:text-ivory/45 focus:outline-none focus:border-goldBrand"
                      />
                      <button
                        type="submit"
                        className="px-4 py-2.5 rounded-lg bg-goldBrand text-charcoal text-sm font-bold shrink-0"
                      >
                        Subscribe
                      </button>
                    </form>
                  )}
                </div>
              </div>

              <div className="pt-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-ivory/60">
                <p>© {new Date().getFullYear()} TravelFixer · Part of the Fixer Venture Group. All rights reserved.</p>
                <div className="flex items-center gap-6">
                  <a href="#top" className="hover:text-ivory">Privacy</a>
                  <a href="#top" className="hover:text-ivory">Terms</a>
                  <a href="#top" className="hover:text-ivory">Fixer Verification</a>
                </div>
              </div>
            </div>
          </footer>

          {/* =================================================================
              STICKY MOBILE CTA BAR ON SCROLL (For Guests)
              ================================================================= */}
          {showStickyBar && userRole === 'guest' && (
            <div className="fixed bottom-0 inset-x-0 z-40 sm:hidden bg-ivory border-t border-borderWarm px-4 py-3 flex items-center justify-between gap-3">
              <span className="text-xs font-medium text-charcoal">
                Unlock Accra field notes &amp; saved trips.
              </span>
              <button
                type="button"
                onClick={() => { setAuthMode('signup'); setAuthModalOpen(true); }}
                className="px-4 py-2 rounded-lg bg-emeraldBrand text-ivory text-xs font-bold shrink-0"
              >
                Join free
              </button>
            </div>
          )}

          {/* =================================================================
              MODAL 1: "TALK TO A FIXER" LOCK MODAL (For Non-Subscribers)
              ================================================================= */}
          {lockModalFixer && (
            <div
              className="fixed inset-0 z-50 bg-charcoal/70 flex items-center justify-center p-4"
              role="dialog"
              aria-modal="true"
              aria-labelledby="lock-modal-title"
            >
              <div className="bg-ivory border border-borderWarm rounded-2xl max-w-md w-full p-6 sm:p-8 space-y-5">
                <div className="flex items-start justify-between gap-4">
                  <div>
                    <p className="text-xs font-semibold uppercase tracking-widest text-goldText">
                      Private 1-on-1 Call · {lockModalFixer.city}
                    </p>
                    <h3 id="lock-modal-title" className="font-serif text-2xl font-semibold text-charcoal mt-1">
                      Free to join. Subscribe to talk.
                    </h3>
                  </div>
                  <button
                    type="button"
                    onClick={() => setLockModalFixer(null)}
                    aria-label="Close modal"
                    className="text-charcoal/60 hover:text-charcoal text-lg font-bold"
                  >
                    ✕
                  </button>
                </div>

                <p className="text-sm text-charcoal/80 leading-relaxed">
                  Direct video calls with <strong>{lockModalFixer.name}</strong> and personalised written Trip Briefs are included with <strong>Fixer+</strong> ($15/mo or $129/yr).
                </p>

                <div className="space-y-2.5 pt-1">
                  <button
                    type="button"
                    onClick={() => {
                      setUserRole('subscriber');
                      setLockModalFixer(null);
                    }}
                    className="w-full py-3 px-4 rounded-xl bg-emeraldBrand text-ivory font-semibold text-sm hover:bg-emeraldHover"
                  >
                    Subscribe to Fixer+ ($15/mo)
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      setUserRole('free');
                      setLockModalFixer(null);
                    }}
                    className="w-full py-3 px-4 rounded-xl border border-borderWarm bg-white text-charcoal font-semibold text-sm hover:border-emeraldBrand"
                  >
                    Join free to read field notes
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* =================================================================
              MODAL 2: NO-LOGIN EXPRESS TICKET CHECKOUT
              ================================================================= */}
          {selectedOffer && (
            <div
              className="fixed inset-0 z-50 bg-charcoal/70 flex items-center justify-center p-4"
              role="dialog"
              aria-modal="true"
              aria-labelledby="checkout-modal-title"
            >
              <div className="bg-ivory border border-borderWarm rounded-2xl max-w-md w-full p-6 sm:p-8">
                <div className="flex items-start justify-between gap-4 pb-4 border-b border-borderWarm">
                  <div>
                    <p className="text-xs font-semibold uppercase tracking-widest text-emeraldBrand">
                      Express Guest Checkout
                    </p>
                    <h3 id="checkout-modal-title" className="font-serif text-xl font-semibold text-charcoal mt-0.5">
                      {selectedOffer.airline || selectedOffer.name}
                    </h3>
                  </div>
                  <button
                    type="button"
                    onClick={() => setSelectedOffer(null)}
                    aria-label="Close checkout"
                    className="text-charcoal/60 hover:text-charcoal font-bold"
                  >
                    ✕
                  </button>
                </div>

                <form onSubmit={handleCompleteBooking} className="mt-4 space-y-4">
                  <div>
                    <label htmlFor="pax-name" className="block text-xs font-semibold text-charcoal mb-1">
                      Lead traveller full name (as on passport)
                    </label>
                    <input
                      id="pax-name"
                      type="text"
                      required
                      value={passengerName}
                      onChange={(e) => setPassengerName(e.target.value)}
                      placeholder="e.g. Mike T S Ncube"
                      className="w-full px-3.5 py-2.5 rounded-lg bg-white border border-borderWarm text-sm"
                    />
                  </div>

                  <div>
                    <label htmlFor="pax-email" className="block text-xs font-semibold text-charcoal mb-1">
                      Email for instant e-ticket
                    </label>
                    <input
                      id="pax-email"
                      type="email"
                      required
                      value={passengerEmail}
                      onChange={(e) => setPassengerEmail(e.target.value)}
                      placeholder="you@example.com"
                      className="w-full px-3.5 py-2.5 rounded-lg bg-white border border-borderWarm text-sm"
                    />
                  </div>

                  <div className="p-3.5 rounded-xl bg-stoneWarm flex items-center justify-between text-sm">
                    <span>Total due today</span>
                    <strong className="text-lg text-charcoal">
                      ${userRole === 'subscriber' ? selectedOffer.memberPrice : selectedOffer.standardPrice}
                    </strong>
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3.5 px-4 rounded-xl bg-goldBrand text-charcoal font-bold text-sm hover:bg-goldBrand/90"
                  >
                    Confirm &amp; issue e-ticket
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* =================================================================
              MODAL 3: SIGN IN / JOIN FREE (Email + Google)
              ================================================================= */}
          {authModalOpen && (
            <div
              className="fixed inset-0 z-50 bg-charcoal/70 flex items-center justify-center p-4"
              role="dialog"
              aria-modal="true"
              aria-labelledby="auth-modal-title"
            >
              <div className="bg-ivory border border-borderWarm rounded-2xl max-w-md w-full p-6 sm:p-8 space-y-5">
                <div className="flex items-start justify-between">
                  <div>
                    <p className="text-xs font-semibold uppercase tracking-widest text-goldText">
                      {authMode === 'signup' ? 'Free Forever' : 'Welcome Back'}
                    </p>
                    <h3 id="auth-modal-title" className="font-serif text-2xl font-semibold text-charcoal mt-1">
                      {authMode === 'signup' ? 'Create your free account' : 'Sign in to TravelFixer'}
                    </h3>
                  </div>
                  <button
                    type="button"
                    onClick={() => setAuthModalOpen(false)}
                    aria-label="Close authentication modal"
                    className="text-charcoal/60 hover:text-charcoal font-bold"
                  >
                    ✕
                  </button>
                </div>

                <button
                  type="button"
                  onClick={() => { setUserRole('free'); setAuthModalOpen(false); }}
                  className="w-full py-3 px-4 rounded-xl bg-white border border-borderWarm text-charcoal font-semibold text-sm hover:border-emeraldBrand flex items-center justify-center gap-2"
                >
                  <span>Continue with Google</span>
                </button>

                <div className="text-center text-xs text-charcoal/50">or with email</div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    setUserRole('free');
                    setAuthModalOpen(false);
                  }}
                  className="space-y-3"
                >
                  <div>
                    <label htmlFor="auth-email" className="sr-only">Email address</label>
                    <input
                      id="auth-email"
                      type="email"
                      required
                      placeholder="Email address"
                      className="w-full px-3.5 py-2.5 rounded-lg bg-white border border-borderWarm text-sm"
                    />
                  </div>
                  <div>
                    <label htmlFor="auth-pass" className="sr-only">Password</label>
                    <input
                      id="auth-pass"
                      type="password"
                      required
                      placeholder="Password"
                      className="w-full px-3.5 py-2.5 rounded-lg bg-white border border-borderWarm text-sm"
                    />
                  </div>
                  <button
                    type="submit"
                    className="w-full py-3 px-4 rounded-xl bg-emeraldBrand text-ivory font-semibold text-sm hover:bg-emeraldHover"
                  >
                    {authMode === 'signup' ? 'Join free' : 'Sign in'}
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
